version: '3.8'

services:
  padly:
    build: .
    container_name: padly_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - padly_data:/app/data
      - padly_uploads:/app/uploads

volumes:
  padly_data:
  padly_uploads:
